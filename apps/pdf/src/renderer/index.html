<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- script-src 'wasm-unsafe-eval': pdf.js image codecs (jbig2/openjpeg/qcms) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARAReader</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #f3f4f6;
        color: #4b5363;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #0d0f13;
          color: #9ba3b4;
        }
      }
      .boot-loader {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(120, 130, 150, 0.22);
        border-top-color: #4c8dff;
        animation: boot-spin 0.75s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-busy="true">
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
